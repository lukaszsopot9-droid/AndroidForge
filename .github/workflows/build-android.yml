name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Ścieżka do ZIP-a w repozytorium, np. input/projekt.zip'
        required: false
        default: 'input/projekt.zip'
        type: string
      download_url:
        description: 'Opcjonalny bezpośredni URL do ZIP-a (ma pierwszeństwo przed ścieżką)'
        required: false
        default: ''
        type: string
      build_variant:
        description: 'Co zbudować'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - bundle

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK / AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Obtain project ZIP
        id: source
        shell: bash
        env:
          SOURCE_ZIP: ${{ inputs.source_zip }}
          DOWNLOAD_URL: ${{ inputs.download_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-source" "$RUNNER_TEMP/android-unpacked"
          ZIP_FILE="$RUNNER_TEMP/android-source/project.zip"

          if [[ -n "$DOWNLOAD_URL" ]]; then
            echo "Pobieram ZIP z podanego adresu..."
            curl --fail --location --retry 3 --retry-delay 2 "$DOWNLOAD_URL" --output "$ZIP_FILE"
          else
            if [[ -z "$SOURCE_ZIP" || ! -f "$GITHUB_WORKSPACE/$SOURCE_ZIP" ]]; then
              echo "Nie znaleziono ZIP-a: ${SOURCE_ZIP:-brak ścieżki}." >&2
              echo "Dodaj plik ZIP do repozytorium (np. input/projekt.zip) albo podaj download_url." >&2
              exit 1
            fi
            cp "$GITHUB_WORKSPACE/$SOURCE_ZIP" "$ZIP_FILE"
          fi

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/android-unpacked"
          PROJECT_DIR=""
          while IFS= read -r -d '' candidate; do
            if [[ -f "$candidate/package.json" && -d "$candidate/android" ]]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find "$RUNNER_TEMP/android-unpacked" -type f -name package.json -print0)

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ZIP nie zawiera katalogu projektu z package.json oraz android/." >&2
            echo "Zawartość ZIP-a musi obejmować cały projekt Capacitor, a nie sam folder android/." >&2
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projekt: $PROJECT_DIR"

      - name: Install npm dependencies
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            echo "Brak package-lock.json. Nie uruchamiam npm install, aby nie zmieniać losowo wersji zależności." >&2
            exit 1
          fi

      - name: Synchronize Capacitor Android project
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install cap sync android

          if [[ ! -f android/gradlew ]]; then
            echo "Po synchronizacji nie znaleziono android/gradlew." >&2
            exit 1
          fi
          chmod +x android/gradlew

          echo "--- Capacitor packages ---"
          npm ls @capacitor/core @capacitor/android @capacitor/cli || true
          echo "--- Gradle wrapper ---"
          grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Verify Android project configuration
        working-directory: ${{ steps.source.outputs.project_dir }}/android
        shell: bash
        run: |
          set -euo pipefail
          echo "Java:"; java -version
          echo "Gradle wrapper:"; ./gradlew --version
          echo "Modules in settings:"
          sed -n '1,220p' settings.gradle
          echo "--- app dependencies ---"
          grep -nE 'capacitor-android|com\.capacitorjs:core|capacitor-cordova' app/build.gradle || true

      - name: Build Android output
        id: build
        working-directory: ${{ steps.source.outputs.project_dir }}/android
        shell: bash
        env:
          BUILD_VARIANT: ${{ inputs.build_variant }}
        run: |
          set -euo pipefail
          case "$BUILD_VARIANT" in
            debug)
              TASK="assembleDebug"
              ;;
            release)
              TASK="assembleRelease"
              ;;
            bundle)
              TASK="bundleRelease"
              ;;
            *)
              echo "Nieznany wariant: $BUILD_VARIANT" >&2
              exit 1
              ;;
          esac

          ./gradlew --no-daemon --stacktrace --warning-mode all clean "$TASK" 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Collect build outputs
        if: always() && steps.source.outputs.project_dir != ''
        id: collect
        working-directory: ${{ steps.source.outputs.project_dir }}/android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-artifacts"
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp --parents {} "$RUNNER_TEMP/android-artifacts/" \; 2>/dev/null || true
          if find "$RUNNER_TEMP/android-artifacts" -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Nie znaleziono pliku APK/AAB."
          fi

      - name: Upload APK / AAB
        if: always() && steps.collect.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.build_variant }}-${{ github.run_number }}
          path: ${{ runner.temp }}/android-artifacts/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_number }}
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore
          retention-days: 14
